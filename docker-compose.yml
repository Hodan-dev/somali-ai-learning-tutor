services:
  mongo:
    image: mongo:7
    container_name: somali-tutor-mongo
    ports:
      - '27017:27017'
    volumes:
      - somali_tutor_mongo:/data/db
    restart: unless-stopped

  mongo-express:
    image: mongo-express:1
    container_name: somali-tutor-mongo-ui
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: 'false'
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  somali_tutor_mongo:
